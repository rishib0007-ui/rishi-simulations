<?xml version="1.0" encoding="UTF-8"?>
<!-- assets/newton-apple.svg - stylized Newton with apple profile (SVG) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="20" fill="url(#g1)" />
  <!-- face -->
  <circle cx="60" cy="46" r="22" fill="#f0d4af"/>
  <!-- hair -->
  <path d="M40 40 Q60 12 80 40" fill="#1f2937"/>
  <!-- eyes -->
  <circle cx="52" cy="46" r="2.2" fill="#111827"/>
  <circle cx="68" cy="46" r="2.2" fill="#111827"/>
  <!-- smile -->
  <path d="M50 56 Q60 64 70 56" stroke="#111827" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- neck/body -->
  <rect x="46" y="64" width="28" height="20" rx="8" fill="#111827"/>

  <!-- apple on the right -->
  <g transform="translate(84,18)">
    <circle cx="0" cy="0" r="10" fill="#ef4444"/>
    <path d="M-2 -6 Q0 -10 4 -8" stroke="#a21caf" stroke-width="1.2" fill="none"/>
    <path d="M2 -11 Q4 -14 8 -12" stroke="#6b21a8" stroke-width="1.2" fill="none"/>
    <path d="M1 -2 Q4 0 6 -2" stroke="#6b21a8" stroke-width="0.8" fill="none"/>
  </g>

  <!-- subtle glow -->
  <ellipse cx="60" cy="90" rx="36" ry="8" fill="rgba(0,0,0,0.18)"/>
</svg>
